kind = "web"
previewPath = "/"
title = "Game Guide Wiki"
description = "A responsive game攻略 wiki and database UI with character, medal, support formation, ranking, and profile screens backed by reusable mock data."
version = "1.0.0"
id = "artifacts/game-guide-wiki"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23496

[services.development]
run = "pnpm --filter @workspace/game-guide-wiki run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/game-guide-wiki", "run", "build" ]
serve = "static"
publicDir = "artifacts/game-guide-wiki/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23496"
BASE_PATH = "/"
